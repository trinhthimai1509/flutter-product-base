name: flutter_project_base
description: "Reusable Flutter product foundation: architecture, core services, chat engine and opt-in capability packages."
publish_to: 'none'
version: 0.1.0+1

# Opt-in capability packages (see docs/MODULE_CATALOG.md). Remove a package
# here, in `workspace:` and in lib/app/capabilities/ to drop it from an app.
workspace:
  - packages/pb_ads
  - packages/pb_billing
  - packages/pb_common
  - packages/pb_connectivity
  - packages/pb_notifications
  - packages/pb_onboarding
  - packages/pb_premium
  - packages/pb_review
  - packages/pb_telemetry
  - packages/pb_telemetry_firebase

environment:
  sdk: ^3.13.4

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  pb_ads:
    path: packages/pb_ads
  pb_billing:
    path: packages/pb_billing
  pb_common:
    path: packages/pb_common
  pb_connectivity:
    path: packages/pb_connectivity
  pb_notifications:
    path: packages/pb_notifications
  pb_onboarding:
    path: packages/pb_onboarding
  pb_premium:
    path: packages/pb_premium
  pb_review:
    path: packages/pb_review
  pb_telemetry:
    path: packages/pb_telemetry
  pb_telemetry_firebase:
    path: packages/pb_telemetry_firebase
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
