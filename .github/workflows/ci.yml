name: CI

# Runs the quality gates from AGENTS.md on every pull request and push to
# main: format, analyze, app tests, every package's tests, debug APK build.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format, analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze (app + packages)
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test packages
        run: |
          for package in packages/*/; do
            if [ -d "$package/test" ]; then
              echo "::group::$package"
              (cd "$package" && flutter test)
              echo "::endgroup::"
            fi
          done

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=config/development.json
